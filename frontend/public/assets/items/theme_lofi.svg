<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="lofi-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e"/>
      <stop offset="40%" stop-color="#2d2342"/>
      <stop offset="80%" stop-color="#56385d"/>
      <stop offset="100%" stop-color="#7a4b6c"/>
    </linearGradient>
    <linearGradient id="lofi-moon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="lofi-cloud-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="320" height="180" fill="url(#lofi-sky)" rx="10"/>

  <!-- Soft Stars -->
  <g fill="#fed7aa" opacity="0.6">
    <circle cx="45" cy="30" r="1"/>
    <circle cx="85" cy="22" r="1.5"/>
    <circle cx="120" cy="45" r="1"/>
    <circle cx="160" cy="25" r="1.2"/>
    <circle cx="210" cy="35" r="1"/>
    <circle cx="270" cy="20" r="1.5"/>
    <circle cx="290" cy="50" r="1"/>
    <circle cx="140" cy="65" r="0.8"/>
  </g>

  <!-- Crescent Moon -->
  <g transform="translate(225, 30)">
    <circle cx="24" cy="24" r="22" fill="url(#lofi-moon-grad)" opacity="0.9"/>
    <circle cx="18" cy="18" r="20" fill="#2d2342"/>
  </g>

  <!-- Dreamy Pastel Clouds -->
  <path d="M-20 120 Q30 95 80 110 Q140 100 190 120 Q240 110 340 125 L340 180 L-20 180 Z" fill="url(#lofi-cloud-grad)"/>
  <path d="M-20 135 Q50 120 110 130 Q180 125 250 140 Q290 135 340 145 L340 180 L-20 180 Z" fill="#251c35" opacity="0.75"/>

  <!-- Cozy Window Silhouette & Coffee Mug -->
  <g transform="translate(70, 75)" opacity="0.85">
    <!-- Window Frame outline -->
    <rect x="0" y="0" width="80" height="75" rx="4" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.5"/>
    <line x1="40" y1="0" x2="40" y2="75" stroke="#f472b6" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="40" x2="80" y2="40" stroke="#f472b6" stroke-width="1" opacity="0.4"/>
    <!-- Small desk plant -->
    <path d="M15 75 L25 75 L23 60 L17 60 Z" fill="#1e1b2e"/>
    <path d="M20 60 Q28 50 32 54" stroke="#a78bfa" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M20 60 Q12 48 8 52" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Lo-Fi Sound Waveform -->
  <g stroke="#f472b6" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="180" y1="150" x2="180" y2="158"/>
    <line x1="186" y1="146" x2="186" y2="162"/>
    <line x1="192" y1="142" x2="192" y2="166"/>
    <line x1="198" y1="148" x2="198" y2="160"/>
    <line x1="204" y1="144" x2="204" y2="164"/>
    <line x1="210" y1="151" x2="210" y2="157"/>
  </g>
</svg>
