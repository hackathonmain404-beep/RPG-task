<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="cn-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02131d"/>
      <stop offset="50%" stop-color="#051c2c"/>
      <stop offset="100%" stop-color="#010a10"/>
    </linearGradient>
    <linearGradient id="cn-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <radialGradient id="cn-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <filter id="cn-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#cn-bg)" rx="10"/>
  <circle cx="160" cy="90" r="75" fill="url(#cn-glow)"/>

  <!-- Ninja Hood / Cowl -->
  <g filter="url(#cn-blur)">
    <!-- Shoulders / Pauldrons -->
    <path d="M100 160 C120 135 140 125 160 125 C180 125 200 135 220 160 L210 175 L110 175 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M125 140 L160 155 L195 140" fill="none" stroke="#0ea5e9" stroke-width="2"/>

    <!-- Hood Outline -->
    <path d="M160 25 C125 25 110 60 115 110 C120 130 135 140 160 145 C185 140 200 130 205 110 C210 60 195 25 160 25 Z" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>
    <path d="M160 28 C135 28 122 55 125 95 C128 115 140 128 160 130 C180 128 192 115 195 95 C198 55 185 28 160 28 Z" fill="#030712"/>

    <!-- Nano-Faceplate -->
    <path d="M135 85 L160 100 L185 85 L180 115 L160 125 L140 115 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>

    <!-- Glowing Cyber Visor -->
    <polygon points="132,72 188,72 182,82 138,82" fill="url(#cn-cyan)"/>
    <line x1="140" y1="77" x2="180" y2="77" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Forehead Cyber Sigil -->
    <polygon points="160,42 165,52 160,60 155,52" fill="#38bdf8"/>
    <circle cx="160" cy="52" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Digital Sparks / Circuit Pixels -->
  <g fill="#38bdf8" opacity="0.8">
    <circle cx="105" cy="50" r="1.5"/>
    <circle cx="215" cy="50" r="1.5"/>
    <circle cx="95" cy="95" r="1"/>
    <circle cx="225" cy="95" r="1"/>
    <circle cx="140" cy="20" r="1.2"/>
    <circle cx="180" cy="20" r="1.2"/>
  </g>
</svg>
