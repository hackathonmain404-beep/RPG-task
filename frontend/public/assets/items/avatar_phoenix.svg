<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="ph-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#120404"/>
      <stop offset="50%" stop-color="#1f0707"/>
      <stop offset="100%" stop-color="#0a0202"/>
    </linearGradient>
    <linearGradient id="ph-fire-wing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="75%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="ph-head-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <radialGradient id="ph-flame-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <filter id="ph-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="180" fill="url(#ph-bg)" rx="10"/>

  <!-- Molten Radiant Aura -->
  <circle cx="160" cy="90" r="75" fill="url(#ph-flame-glow)"/>

  <!-- Phoenix Wing Flames -->
  <g filter="url(#ph-glow)">
    <!-- Left Wing Feathers -->
    <path d="M160 115 C130 110 95 85 70 50 C85 72 105 85 130 90 C105 70 85 55 60 25 C80 50 110 65 140 75 C120 50 100 35 80 10 C105 35 135 55 155 70 Z" fill="url(#ph-fire-wing)"/>
    <!-- Right Wing Feathers (Symmetric) -->
    <path d="M160 115 C190 110 225 85 250 50 C235 72 215 85 190 90 C215 70 235 55 260 25 C240 50 210 65 180 75 C200 50 220 35 240 10 C215 35 185 55 165 70 Z" fill="url(#ph-fire-wing)"/>

    <!-- Tail Plumage Streams -->
    <path d="M160 120 C155 135 140 150 135 168 C145 155 155 145 158 135 Z" fill="#ea580c"/>
    <path d="M160 120 C165 135 180 150 185 168 C175 155 165 145 162 135 Z" fill="#ea580c"/>
    <path d="M160 120 C158 140 158 155 160 172 C162 155 162 140 160 120 Z" fill="#fde047"/>

    <!-- Radiant Phoenix Heart & Torso -->
    <path d="M160 70 C150 82 148 102 160 118 C172 102 170 82 160 70 Z" fill="url(#ph-head-grad)"/>

    <!-- Phoenix Crowned Head Crest -->
    <path d="M160 40 Q155 52 160 70 Q165 52 160 40 Z" fill="#fef08a"/>
    <path d="M160 50 Q145 35 135 20 Q150 35 156 52 Z" fill="#f97316"/>
    <path d="M160 50 Q175 35 185 20 Q170 35 164 52 Z" fill="#f97316"/>
    <!-- Golden Beak -->
    <polygon points="160,54 157,60 163,60" fill="#fef08a"/>
    <!-- Eye Gems -->
    <circle cx="157" cy="52" r="1.5" fill="#fef08a"/>
    <circle cx="163" cy="52" r="1.5" fill="#fef08a"/>
  </g>

  <!-- Rising Embers & Sparkles -->
  <g fill="#fde047">
    <circle cx="120" cy="40" r="1.2" opacity="0.8"/>
    <circle cx="200" cy="40" r="1.2" opacity="0.8"/>
    <circle cx="100" cy="80" r="1" opacity="0.6"/>
    <circle cx="220" cy="80" r="1" opacity="0.6"/>
    <circle cx="145" cy="25" r="1.5" opacity="0.9"/>
    <circle cx="175" cy="25" r="1.5" opacity="0.9"/>
    <circle cx="160" cy="15" r="1.8" opacity="0.95"/>
    <circle cx="80" cy="110" r="1.2" opacity="0.5"/>
    <circle cx="240" cy="110" r="1.2" opacity="0.5"/>
  </g>
</svg>
