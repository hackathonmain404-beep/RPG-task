<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="retro-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f0e1c"/>
      <stop offset="100%" stop-color="#1b1730"/>
    </linearGradient>
    <linearGradient id="blade-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="pixel-grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="320" height="180" fill="url(#retro-bg)" rx="10"/>
  <rect width="320" height="180" fill="url(#pixel-grid)" rx="10"/>

  <!-- Pixelated Dungeon Archway -->
  <g fill="#27223e">
    <!-- Left Column -->
    <rect x="50" y="30" width="20" height="130"/>
    <rect x="44" y="24" width="32" height="12"/>
    <rect x="44" y="150" width="32" height="12"/>
    <!-- Right Column -->
    <rect x="250" y="30" width="20" height="130"/>
    <rect x="244" y="24" width="32" height="12"/>
    <rect x="244" y="150" width="32" height="12"/>
    <!-- Arch Top Steps -->
    <rect x="70" y="24" width="180" height="10"/>
    <rect x="85" y="34" width="150" height="10"/>
    <rect x="105" y="44" width="110" height="8"/>
  </g>

  <!-- Dungeon Torch Glows -->
  <circle cx="60" cy="80" r="14" fill="#facc15" opacity="0.15"/>
  <rect x="58" y="78" width="4" height="6" fill="#facc15"/>
  <circle cx="260" cy="80" r="14" fill="#facc15" opacity="0.15"/>
  <rect x="258" y="78" width="4" height="6" fill="#facc15"/>

  <!-- Pixel Stone Pedestal -->
  <g fill="#373154">
    <rect x="130" y="132" width="60" height="12"/>
    <rect x="120" y="144" width="80" height="16"/>
  </g>

  <!-- Pixel Master Sword In Stone -->
  <g transform="translate(160, 50)">
    <!-- Hilt & Crossguard -->
    <rect x="-3" y="0" width="6" height="14" fill="#facc15"/>
    <rect x="-5" y="-3" width="10" height="4" fill="#ca8a04"/>
    <rect x="-14" y="14" width="28" height="5" fill="#facc15"/>
    <rect x="-2" y="12" width="4" height="8" fill="#3b82f6"/>
    <!-- Blade -->
    <rect x="-4" y="19" width="8" height="65" fill="#e2e8f0"/>
    <rect x="-1" y="19" width="2" height="60" fill="#4ade80"/>
    <polygon points="0,88 -4,84 4,84" fill="#e2e8f0"/>
  </g>

  <!-- Pixel Sparkles -->
  <g fill="#4ade80">
    <rect x="135" y="70" width="3" height="3"/>
    <rect x="180" y="65" width="3" height="3"/>
    <rect x="125" y="105" width="4" height="4"/>
    <rect x="190" y="95" width="4" height="4"/>
  </g>

  <!-- CRT Scanline Overlay -->
  <g stroke="rgba(0,0,0,0.25)" stroke-width="1">
    <line x1="0" y1="20" x2="320" y2="20"/>
    <line x1="0" y1="40" x2="320" y2="40"/>
    <line x1="0" y1="60" x2="320" y2="60"/>
    <line x1="0" y1="80" x2="320" y2="80"/>
    <line x1="0" y1="100" x2="320" y2="100"/>
    <line x1="0" y1="120" x2="320" y2="120"/>
    <line x1="0" y1="140" x2="320" y2="140"/>
    <line x1="0" y1="160" x2="320" y2="160"/>
  </g>
</svg>
