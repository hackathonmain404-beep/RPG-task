<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="vk-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11051c"/>
      <stop offset="50%" stop-color="#19092c"/>
      <stop offset="100%" stop-color="#0a0212"/>
    </linearGradient>
    <linearGradient id="vk-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <radialGradient id="vk-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
    </radialGradient>
    <filter id="vk-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#vk-bg)" rx="10"/>
  <circle cx="160" cy="90" r="75" fill="url(#vk-glow)"/>

  <!-- Void Knight Greathelm -->
  <g filter="url(#vk-blur)">
    <!-- Heavy Pauldrons -->
    <path d="M90 165 C115 130 140 120 160 120 C180 120 205 130 230 165 L220 178 L100 178 Z" fill="#180d28" stroke="#a855f7" stroke-width="1.8"/>
    <!-- Void Horns -->
    <path d="M125 60 C110 30 85 20 75 10 C90 30 105 45 118 70 Z" fill="url(#vk-purple)"/>
    <path d="M195 60 C210 30 235 20 245 10 C230 30 215 45 202 70 Z" fill="url(#vk-purple)"/>

    <!-- Helm Base -->
    <path d="M125 55 C125 35 140 25 160 25 C180 25 195 35 195 55 L200 105 C195 130 175 145 160 148 C145 145 125 130 120 105 Z" fill="#0f071a" stroke="#4c1d95" stroke-width="2"/>

    <!-- Faceplate Slits -->
    <path d="M130 85 L160 100 L190 85 L185 110 L160 120 L135 110 Z" fill="#07030b" stroke="#7e22ce" stroke-width="1.5"/>

    <!-- Ethereal Eye Glow -->
    <path d="M136 78 Q160 88 184 78 Q160 84 136 78 Z" fill="#e9d5ff"/>
    <circle cx="150" cy="80" r="2" fill="#f3e8ff"/>
    <circle cx="170" cy="80" r="2" fill="#f3e8ff"/>
  </g>

  <!-- Void Embers -->
  <g fill="#c084fc" opacity="0.75">
    <circle cx="110" cy="40" r="1.5"/>
    <circle cx="210" cy="40" r="1.5"/>
    <circle cx="90" cy="90" r="1.2"/>
    <circle cx="230" cy="90" r="1.2"/>
    <circle cx="160" cy="18" r="1.8"/>
  </g>
</svg>
