<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="valk-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1303"/>
      <stop offset="50%" stop-color="#2a1d06"/>
      <stop offset="100%" stop-color="#0f0901"/>
    </linearGradient>
    <linearGradient id="valk-gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <radialGradient id="valk-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <filter id="valk-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#valk-bg)" rx="10"/>
  <circle cx="160" cy="90" r="75" fill="url(#valk-glow)"/>

  <!-- Celestial Valkyrie Winged Diadem -->
  <g filter="url(#valk-blur)">
    <!-- Golden Winged Ears / Crest -->
    <path d="M115 70 C85 45 65 25 55 10 C75 35 100 55 125 75 Z" fill="url(#valk-gold)"/>
    <path d="M120 85 C95 65 80 45 75 30 C90 55 110 75 128 88 Z" fill="#d97706"/>
    <path d="M205 70 C235 45 255 25 265 10 C245 35 220 55 195 75 Z" fill="url(#valk-gold)"/>
    <path d="M200 85 C225 65 240 45 245 30 C230 55 210 75 192 88 Z" fill="#d97706"/>

    <!-- Gorget / Collar Plate -->
    <path d="M100 160 C125 130 145 122 160 122 C175 122 195 130 220 160 L210 175 L110 175 Z" fill="#2d1d07" stroke="url(#valk-gold)" stroke-width="1.8"/>

    <!-- Helm / Crown Face Framing -->
    <path d="M130 50 C130 30 145 20 160 20 C175 20 190 30 190 50 L195 100 C190 125 175 138 160 140 C145 138 130 125 125 100 Z" fill="#140e04" stroke="#d97706" stroke-width="2"/>

    <!-- Solar Forehead Gem -->
    <polygon points="160,25 166,35 160,45 154,35" fill="url(#valk-gold)"/>
    <circle cx="160" cy="35" r="2" fill="#ffffff"/>

    <!-- Radiant Gaze -->
    <ellipse cx="147" cy="75" rx="5" ry="2.5" fill="#fef08a"/>
    <circle cx="147" cy="75" r="1.5" fill="#ffffff"/>
    <ellipse cx="173" cy="75" rx="5" ry="2.5" fill="#fef08a"/>
    <circle cx="173" cy="75" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Golden Sparkles -->
  <g fill="#fef08a" opacity="0.85">
    <circle cx="90" cy="40" r="1.5"/>
    <circle cx="230" cy="40" r="1.5"/>
    <circle cx="75" cy="85" r="1.2"/>
    <circle cx="245" cy="85" r="1.2"/>
    <circle cx="160" cy="12" r="1.8"/>
  </g>
</svg>
