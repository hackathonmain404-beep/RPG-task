<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="is-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="50%" stop-color="#1f2024"/>
      <stop offset="100%" stop-color="#0c0d0e"/>
    </linearGradient>
    <linearGradient id="is-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="is-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0"/>
    </radialGradient>
    <filter id="is-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#is-bg)" rx="10"/>
  <circle cx="160" cy="90" r="75" fill="url(#is-glow)"/>

  <!-- Iron Sentinel Bastion Helm -->
  <g filter="url(#is-blur)">
    <!-- Heavy Riveted Pauldrons -->
    <path d="M85 165 C110 130 135 120 160 120 C185 120 210 130 235 165 L225 178 L95 178 Z" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <!-- Shoulder Rivets -->
    <circle cx="115" cy="155" r="2" fill="#94a3b8"/>
    <circle cx="130" cy="142" r="2" fill="#94a3b8"/>
    <circle cx="190" cy="142" r="2" fill="#94a3b8"/>
    <circle cx="205" cy="155" r="2" fill="#94a3b8"/>

    <!-- Vanguard Visor Crown -->
    <path d="M125 45 L160 25 L195 45 L195 110 L160 140 L125 110 Z" fill="#0f172a" stroke="url(#is-steel)" stroke-width="2.5"/>

    <!-- Furnace Eye Slit (Crimson) -->
    <rect x="135" y="70" width="50" height="10" rx="3" fill="#ef4444"/>
    <line x1="140" y1="75" x2="180" y2="75" stroke="#fca5a5" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Grille Vents -->
    <line x1="145" y1="95" x2="175" y2="95" stroke="#475569" stroke-width="2"/>
    <line x1="148" y1="102" x2="172" y2="102" stroke="#475569" stroke-width="2"/>
    <line x1="152" y1="109" x2="168" y2="109" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Sparks -->
  <g fill="#f87171" opacity="0.75">
    <circle cx="105" cy="45" r="1.3"/>
    <circle cx="215" cy="45" r="1.3"/>
    <circle cx="95" cy="95" r="1"/>
    <circle cx="225" cy="95" r="1"/>
    <circle cx="160" cy="18" r="1.6"/>
  </g>
</svg>
